# Run the chain on the released aegir, Shannon and Trout packages locked in
# pixi.lock. Weekly as well, to catch a broken lock update or channel.
name: Chain
on:
  merge_group:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: 0 4 * * 1
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  chain:
    uses: ShipSoft/.github/.github/workflows/pixi-cmake-build.yml@main
    with:
      tasks: '["test"]'
      ccache: false

  all-checks:
    name: All checks passed
    if: always()
    runs-on: ubuntu-latest
    needs: [chain]
    steps:
      - name: Check status of all jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi
