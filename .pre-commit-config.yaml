# Run with prek (https://github.com/j178/prek), a drop-in pre-commit replacement.
# The hook tools are provided by the pixi `lint` environment (see pixi.toml), so
# versions are tracked in pixi.lock and the hooks run identically everywhere.
#
#   pixi run install-hooks   # one-off: install the git hooks
#   pixi run lint            # run all hooks on all files
repos:
  # prek runs these as native Rust builtins (no environment, fully portable).
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Tools below come from the pixi `lint` environment via language: system.
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        language: system
        entry: shellcheck
        types: [shell]

      - id: ruff
        name: ruff
        language: system
        entry: ruff check --fix
        types: [python]

      - id: jsonnetfmt
        name: jsonnetfmt
        language: system
        entry: jsonnetfmt --test
        files: \.(jsonnet|libsonnet)$

      - id: codespell
        name: codespell
        language: system
        entry: codespell
        types: [text]
        exclude: ^pixi\.lock$

      - id: reuse
        name: reuse lint
        language: system
        entry: reuse lint
        pass_filenames: false
        always_run: true

      - id: commitizen
        name: commitizen (conventional commits)
        language: system
        entry: cz check --commit-msg-file
        stages: [commit-msg]
